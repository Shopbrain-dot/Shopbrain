<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - ShopBrain</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .logo span {
      color: #2563eb;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      margin-bottom: 18px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #2563eb;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #fee2e2;
      color: #991b1b;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
    }

    .signup a {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="box">

    <div class="logo">
      Shop<span>Brain</span>
    </div>

    <p class="subtitle">
      Sign in to manage your AI customer service
    </p>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button type="submit">
        Login
      </button>

      <div
        class="message"
        id="message"
      >
        Invalid email or password.
      </div>

    </form>

    <div class="signup">
      Don't have an account?
      <a href="signup.html">
        Create one
      </a>
    </div>

  </div>

  <script>

    document
      .getElementById("loginForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const email =
          document.getElementById("email").value;

        const password =
          document.getElementById("password").value;

        const savedUser =
          localStorage.getItem("shopbrainUser");

        if (!savedUser) {

          document.getElementById("message").style.display =
            "block";

          return;
        }

        const user =
          JSON.parse(savedUser);

        if (
          email === user.email &&
          password === user.password
        ) {

          localStorage.setItem(
            "shopbrainLoggedIn",
            "true"
          );

          window.location.href =
            "dashboard.html";

        } else {

          document.getElementById("message").style.display =
            "block";

        }

      });

  </script>

</body>
</html>
