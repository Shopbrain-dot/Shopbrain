<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ShopBrain - Train AI</title>
</head>
<body>
  <h1>Train Your AI Agent</h1>
  <form id="train-form">
    <textarea id="knowledge" placeholder="Enter training knowledge..." required></textarea>
    <button type="submit">Save Training Data</button>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="supabase-config.js"></script>
  <script type="module">
    import { supabaseClient } from "./supabase-config.js";

    // Ensure user is authenticated
    const { data: { user }, error: userError } = await supabaseClient.auth.getUser();
    if (userError || !user) {
      window.location.href = "login.html";
    }

    // Check if agent exists for this user
    const { data: agent, error: agentError } = await supabaseClient
      .from("agents")
      .select("*")
      .eq("user_id", user.id)
      .maybeSingle();

    if (agentError) {
      console.error(agentError);
      alert(agentError.message);
    }

    if (!agent) {
      alert("You must create an agent before training.");
      window.location.href = "agent.html";
    }

    const form = document.getElementById("train-form");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const knowledgeText = document.getElementById("knowledge").value.trim();
      if (!knowledgeText) {
        alert("Training knowledge cannot be empty.");
        return;
      }

      const { error: insertError } = await supabaseClient.from("knowledge").insert({
        agent_id: agent.id,
        content: knowledgeText,
      });

      if (insertError) {
        console.error(insertError);
        alert(insertError.message);
      } else {
        alert("Training data saved successfully!");
        window.location.href = "chat.html";
      }
    });
  </script>
</body>
</html>
