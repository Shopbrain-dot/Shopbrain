<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create AI Agent - ShopBrain</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: white;
      padding: 20px 7%;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #2563eb;
    }

    .container {
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .intro {
      margin-bottom: 25px;
    }

    .intro h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .intro p {
      color: #6b7280;
      line-height: 1.5;
    }

    .form-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .section {
      margin-bottom: 30px;
    }

    .section h2 {
      font-size: 19px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: #2563eb;
    }

    .button {
      width: 100%;
      padding: 15px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .success {
      display: none;
      margin-top: 20px;
      padding: 15px;
      background: #dcfce7;
      color: #166534;
      border-radius: 8px;
    }

    .continue {
      display: none;
      margin-top: 15px;
      width: 100%;
      padding: 15px;
      background: #111827;
      color: white;
      border-radius: 9px;
      text-decoration: none;
      text-align: center;
      font-weight: bold;
    }

    .continue:hover {
      background: #1f2937;
    }

    @media (max-width: 600px) {
      .container {
        margin: 25px auto;
      }

      .form-card {
        padding: 20px;
      }

      .intro h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    Shop<span>Brain</span>
  </div>
</header>

<div class="container">

  <div class="intro">
    <h1>Create Your AI Agent</h1>

    <p>
      Train your ShopBrain customer-service AI with
      information about your business.
    </p>
  </div>

  <div class="form-card">

    <form id="agentForm">

      <div class="section">

        <h2>🤖 AI Agent</h2>

        <label for="agentName">
          AI Agent Name
        </label>

        <input
          type="text"
          id="agentName"
          placeholder="Example: ShopBrain Assistant"
          required
        >

      </div>


      <div class="section">
