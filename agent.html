<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create AI Agent - ShopBrain</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  color: #111827;
}

header {
  background: #111827;
  color: white;
  padding: 18px;
}

.header {
  max-width: 900px;
  margin: auto;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  font-size: 24px;
  font-weight: bold;
}

.logo span {
  color: #3b82f6;
}

.back {
  color: white;
  text-decoration: none;
  font-weight: bold;
}

.container {
  max-width: 720px;
  margin: 40px auto;
  padding: 20px;
}

.card {
  background: white;
  padding: 30px;
  border-radius: 18px;
  box-shadow: 0 8px 30px rgba(0,0,0,.07);
}

h1 {
  margin-top: 0;
  font-size: 28px;
}

.subtitle {
  color: #6b7280;
  line-height: 1.6;
  margin-bottom: 25px;
}

label {
  display: block;
  font-weight: bold;
  margin-top: 20px;
  margin-bottom: 8px;
}

input,
textarea {
  width: 100%;
  padding: 14px;
  border: 1px solid #d1d5db;
  border-radius: 10px;
  font-size: 15px;
  font-family: Arial, sans-serif;
}

textarea {
  min-height: 120px;
  resize: vertical;
}

input:focus,
textarea:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 3px rgba(37,99,235,.1);
}

button {
  width: 100%;
  margin-top: 28px;
  padding: 15px;
  background: #2563eb;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

button:disabled {
  background: #9ca3af;
  cursor: not-allowed;
}

.message {
  display: none;
  padding: 14px;
  margin-bottom: 20px;
  border-radius: 10px;
  line-height: 1.5;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.success {
  background: #dcfce7;
  color: #166534;
}

.info {
  background: #dbeafe;
  color: #1e40af;
}

.agent-summary {
  background: #f3f4f6;
  padding: 20px;
  border-radius: 10px;
  margin-top: 10px;
}

.dashboard-link {
  display: block;
  text-align: center;
  margin-top: 15px;
  padding: 14px;
  background: #111827;
  color: white;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<header>
  <div class="header">
    <div class="logo">
      Shop<span>Brain</span>
    </div>

    <a href="dashboard.html" class="back">
      ← Dashboard
    </a>
  </div>
</header>


<main class="container">

  <div class="card">

    <h1>🤖 Create Your AI Agent</h1>

    <p class="subtitle">
      Create your ShopBrain customer-service AI.
      Add your business information and teach your AI how to help your customers.
    </p>


    <div
      id="loadingMessage"
      class="message info"
      style="display:block;"
    >
      Checking your account...
    </div>


    <div
      id="infoMessage"
      class="message info"
    ></div>


    <div
      id="errorMessage"
      class="message error"
    ></div>


    <div
      id="successMessage"
      class="message success"
    ></div>


    <!-- EXISTING AGENT -->

    <div
      id="existingAgent"
      class="hidden"
    >

      <h2>Your AI Agent Already Exists</h2>

      <div class="agent-summary">

        <p>
          <strong>AI Name:</strong>
          <span id="existingAgentName"></span>
        </p>

        <p>
          <strong>Business:</strong>
          <span id="existingBusinessName"></span>
        </p>

      </div>

      <a
        href="dashboard.html"
        class="dashboard-link"
      >
        ← Go to Dashboard
      </a>

    </div>


    <!-- CREATE FORM -->

    <form
      id="agentForm"
      class="hidden"
    >

      <label for="agentName">
        AI Agent Name
      </label>

      <input
        type="text"
        id="agentName"
        placeholder="Example: Shop Assistant"
        required
      >


      <label for="businessName">
        Business Name
      </label>

      <input
        type="text"
        id="businessName"
        placeholder="Example: Shopora Market Hub"
        required
      >


      <label for="businessDescription">
        Tell your AI about your business
      </label>

      <textarea
        id="businessDescription"
        placeholder="Example:

We sell gadgets and electronics.
We deliver worldwide.
Our customer support team is available Monday-Friday."
      ></textarea>


      <label for="welcomeMessage">
        AI Welcome Message
      </label>

      <textarea
        id="welcomeMessage"
        placeholder="Example:

Hi! Welcome to our store. How can I help you today?"
      >Hi! How can I help you today?</textarea>


      <button
        type="submit"
        id="createButton"
      >
        🚀 Create AI Agent
      </button>

    </form>

  </div>

</main>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>

const loadingMessage =
  document.getElementById("loadingMessage");

const infoMessage =
  document.getElementById("infoMessage");

const errorMessage =
  document.getElementById("errorMessage");

const successMessage =
  document.getElementById("successMessage");

const agentForm =
  document.getElementById("agentForm");

const existingAgent =
  document.getElementById("existingAgent");

const createButton =
  document.getElementById("createButton");


/*
========================================
HELPER FUNCTIONS
========================================
*/

function showError(message) {

  errorMessage.textContent = message;

  errorMessage.style.display = "block";

  infoMessage.style.display = "none";

  successMessage.style.display = "none";
}


function showSuccess(message) {

  successMessage.textContent = message;

  successMessage.style.display = "block";

  errorMessage.style.display = "none";

  infoMessage.style.display = "none";
}


/*
========================================
LOAD ACCOUNT
========================================
*/

async function loadAgentPage() {

  try {

    /*
    Get authenticated Supabase user
    */

    const {
      data: {
        user
      },
      error: userError
    } =
      await supabaseClient.auth.getUser();


    if (userError) {

      throw userError;

    }


    /*
    No authenticated user
    */

    if (!user) {

      window.location.href =
        "login.html";

      return;

    }


    /*
    Check whether user already has an AI
    */

    const {
      data: agent,
      error: agentError
    } =
      await supabaseClient
        .from("agents")
        .select("*")
        .eq("user_id", user.id)
        .maybeSingle();


    if (agentError) {

      throw agentError;

    }


    /*
    Stop loading message
    */

    loadingMessage.style.display =
      "none";


    /*
    Existing agent
    */

    if (agent) {

      document.getElementById(
        "existingAgentName"
      ).textContent =
        agent.agent_name;


      document.getElementById(
        "existingBusinessName"
      ).textContent =
        agent.business_name;


      existingAgent.classList.remove(
        "hidden"
      );


      return;

    }


    /*
    No agent yet
    */

    agentForm.classList.remove(
      "hidden"
    );

  }

  catch (error) {

    console.error(
      "Agent loading error:",
      error
    );


    loadingMessage.style.display =
      "none";


    showError(
      "Could not check your existing AI agent: " +
      (error.message || "Unknown error")
    );

  }

}


/*
========================================
CREATE AGENT
========================================
*/

agentForm.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    createButton.disabled =
      true;

    createButton.textContent =
      "Creating AI Agent...";


    errorMessage.style.display =
      "none";


    try {

      /*
      Get current authenticated user
      */

      const {
        data: {
          user
        },
        error: userError
      } =
        await supabaseClient.auth.getUser();


      if (userError) {

        throw userError;

      }


      if (!user) {

        throw new Error(
          "You are not logged in. Please log in again."
        );

      }


      /*
      Get form values
      */

      const agentName =
        document
          .getElementById("agentName")
          .value
          .trim();


      const businessName =
        document
          .getElementById("businessName")
          .value
          .trim();


      const businessDescription =
        document
          .getElementById("businessDescription")
          .value
          .trim();


      const welcomeMessage =
        document
          .getElementById("welcomeMessage")
          .value
          .trim();


      if (!agentName) {

        throw new Error(
          "Please enter an AI agent name."
        );

      }


      if (!businessName) {

        throw new Error(
          "Please enter your business name."
        );

      }


      /*
      Insert into Supabase
      */

      const {
        data: newAgent,
        error: insertError
      } =
        await supabaseClient
          .from("agents")
          .insert({

            user_id:
              user.id,

            agent_name:
              agentName,

            business_name:
              businessName,

            business_description:
              businessDescription,

            welcome_message:
              welcomeMessage ||
              "Hi! How can I help you today?"

          })
          .select()
          .single();


      if (insertError) {

        throw insertError;

      }


      console.log(
        "Agent created:",
        newAgent
      );


      showSuccess(
        "✅ Your AI agent was created successfully!"
      );


      agentForm.classList.add(
        "hidden"
      );


      /*
      Redirect to dashboard
      */

      setTimeout(
        function() {

          window.location.href =
            "dashboard.html";

        },
        1000
      );

    }

    catch (error) {

      console.error(
        "Create agent error:",
        error
      );


      showError(
        "Could not create your AI agent: " +
        (error.message || "Unknown error")
      );


      createButton.disabled =
        false;

      createButton.textContent =
        "🚀 Create AI Agent";

    }

  });


/*
========================================
START
========================================
*/

loadAgentPage();

</script>

</body>
</html>
