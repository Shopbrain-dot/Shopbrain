<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ShopBrain - AI Customer Service</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #111827;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 7%;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
    }

    .logo span {
      color: #2563eb;
    }

    nav a {
      margin-left: 25px;
      text-decoration: none;
      color: #374151;
    }

    .hero {
      text-align: center;
      padding: 100px 20px;
    }

    .hero h1 {
      font-size: 52px;
      max-width: 800px;
      margin: auto;
      line-height: 1.1;
    }

    .hero h1 span {
      color: #2563eb;
    }

    .hero p {
      max-width: 600px;
      margin: 25px auto;
      font-size: 18px;
      color: #6b7280;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 15px 28px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }

    .button:hover {
      background: #1d4ed8;
    }

    .features {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 40px 7% 100px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      width: 280px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.05);
    }

    .card h3 {
      margin-bottom: 12px;
    }

    .card p {
      color: #6b7280;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 30px;
      background: white;
      color: #6b7280;
    }

    @media (max-width: 600px) {

      header {
        padding: 18px 5%;
      }

      nav a {
        margin-left: 10px;
        font-size: 14px;
      }

      .hero {
        padding: 70px 20px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .hero p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      Shop<span>Brain</span>
    </div>

    <nav>
      <a href="#features">Features</a>
      <a href="#pricing">Pricing</a>
      <a href="dashboard.html">Dashboard</a>
    </nav>

  </header>


  <section class="hero">
