<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Settings - ShopBrain</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      color: #2563eb;
    }

    .back {
      color: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }

    .container {
      max-width: 850px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .title {
      margin-bottom: 25px;
    }

    .title h1 {
      margin-bottom: 8px;
    }

    .title p {
      color: #6b7280;
    }

    .card {
      background: white;
      padding: 28px;
      border-radius: 14px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.04);
    }

    .card h2 {
      margin-bottom: 20px;
      font-size: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: #2563eb;
    }

    .save {
      width: 100%;
      padding: 14px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 9px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }

    .save:hover {
      background: #1d4ed8;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 8px;
      background: #dcfce7;
      color: #166534;
    }

    .danger {
      border: 1px solid #fecaca;
    }

    .delete {
      padding: 12px 18px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .delete:hover {
      background: #b91c1c;
    }

    .danger p {
      color: #6b7280;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    Shop<span>Brain</span>
  </div>

  <a
    href="dashboard.html"
    class="back"
  >
    ← Dashboard
  </a>

</header>


<div class="container">

  <div class="title">

    <h1>Settings</h1>

    <p>
      Manage your ShopBrain AI agent and business information.
    </p>

  </div>


  <!-- BUSINESS SETTINGS -->

  <div class="card">

    <h2>🏢 Business Information</h2>

    <label for="businessName">
      Business Name
    </label>

    <input
      type="text"
      id="businessName"
      placeholder="Your business name"
    >

    <label for="businessDescription">
      Business Description
    </label>

    <textarea
      id="businessDescription"
      placeholder="Describe your business..."
    ></textarea>

    <button
      class="save"
      id="saveBusiness"
    >
      Save Business Information
    </button>

    <div
      class="success"
      id="businessSuccess"
    >
      ✅ Business information saved.
    </div>

  </div>


  <!-- AI SETTINGS -->

  <div class="card">

    <h2>🤖 AI Agent Settings</h2>

    <label for="agentName">
      AI Agent Name
    </label>

    <input
      type="text"
      id="agentName"
      placeholder="ShopBrain Assistant"
    >

    <label for="instructions">
      AI Instructions
    </label>

    <textarea
      id="instructions"
      placeholder="Tell your AI how it should behave..."
    ></textarea>

    <label for="tone">
      AI Tone
    </label>

    <select id="tone">

      <option value="friendly">
        Friendly
      </option>

      <option value="professional">
        Professional
      </option>

      <option value="casual">
        Casual
      </option>

    </select>

    <button
      class="save"
      id="saveAI"
    >
      Save AI Settings
    </button>

    <div
      class="success"
      id="aiSuccess"
    >
      ✅ AI settings saved.
    </div>

  </div>


  <!-- ACCOUNT -->

  <div class="card">

    <
